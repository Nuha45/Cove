name: Cove weekly seller reports

# Mondays 03:30 UTC (09:00 IST). The API endpoint is idempotent per week, so manual re-runs are safe.
on:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger weekly reports
        env:
          COVE_API_URL: ${{ secrets.COVE_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$COVE_API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::COVE_API_URL or CRON_SECRET repository secret is not set. Skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 600 \
            -X POST "${COVE_API_URL%/}/api/jobs/weekly-reports" \
            -H "Authorization: Bearer ${CRON_SECRET}"
